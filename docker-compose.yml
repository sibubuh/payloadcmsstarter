# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

# @see: https://docs.docker.com/compose/how-tos/multiple-compose-files/include/
name: payload-cms
services:
  pgsql:
    image: postgres:${PGSQL_VERSION:-17-alpine}
    container_name: payload-starter
    hostname: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - payload_starter_data:/var/lib/postgresql/data
      - ./pgsql-multidb.sh:/docker-entrypoint-initdb.d/multidb.sh
    environment:
      POSTGRES_DB: payload-starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: onlypgsql
      POSTGRES_EXTRA_DB: strapi,extradb
      POSTGRES_SCHEMAS: payload-starter:internal,extradb:analytics
    command: ['postgres', '-c', 'wal_level=logical']
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payload-starter']
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  payload_starter_data:
    driver: local
